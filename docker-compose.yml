version: '3.8'

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: mule_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/mulepass123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mule_backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mulepass123
      - JWT_SECRET=super-secret-mule-key-2026
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./datasets:/app/datasets
      - ./ml/model_artifacts:/app/ml/model_artifacts

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mule_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
